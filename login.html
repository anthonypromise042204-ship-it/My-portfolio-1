<hr>

<div class="login-box">

<h2>Login</h2>

<form>

<label>Username:</label><br>
<input type="text" id="name" placeholder="Enter your username"><br><br>

<label>Password:</label><br>
<input type="password" id="password" placeholder="Enter your password"><br><br>

<button type="button" onclick="showMessage()">Login</button>

<p id="message"></p>

</form>

</div>

<script>
function showMessage() {

    let username = document.getElementById("name").value;
    let password = document.getElementById("password").value;

    if (username === "" || password === "") {
        document.getElementById("message").innerHTML =
        "Please fill in all fields.";
    } else if (password === "042204") {
        document.getElementById("message").innerHTML =
        "✅ Welcome, " + username + "!";
    } else {
        document.getElementById("message").innerHTML =
        "❌ Incorrect password.";
    }

}
</script>

</body>
