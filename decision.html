<!DOCTYPE html>
<html>
<head>
    <title>Learning if...else</title>
</head>
<body>

<h1>Learning if...else</h1>

<p id="demo"></p>

<script>

let age = 20;

if (age >= 18) {
    document.getElementById("demo").innerHTML =
    "✅ You are an adult.";
} else {
    document.getElementById("demo").innerHTML =
    "❌ You are under 18.";
}

</script>

</body>
</html>
